name: Build AntiMicro MSIX

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'AntiMicroXboxEdition-MacroPreview-Enhanced.zip'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Extract ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Source ZIP not found" }
          Expand-Archive $zip.FullName "$env:RUNNER_TEMP\src" -Force

      - name: Build MSIX without changing source ZIP
        shell: pwsh
        run: |
          $p = Get-ChildItem "$env:RUNNER_TEMP\src" -Filter "*.csproj" -Recurse | Select-Object -First 1
          if (-not $p) { throw "Project file not found" }

          $manifest = Join-Path $p.DirectoryName "Package.appxmanifest"
          if (-not (Test-Path $manifest)) {
            throw "Package.appxmanifest not found beside $($p.Name)"
          }

          # Add the PhoneIdentity required by this legacy UWP packaging target.
          # This edit is made only in the temporary extracted copy, never in the source ZIP.
          [xml]$manifestXml = Get-Content $manifest
          $root = $manifestXml.DocumentElement
          $phoneNs = "http://schemas.microsoft.com/appx/2014/phone/manifest"
          $existingPhone = $root.SelectSingleNode("*[local-name()='PhoneIdentity']")
          if (-not $existingPhone) {
            $root.SetAttribute("xmlns:mp", $phoneNs)
            $phone = $manifestXml.CreateElement("mp", "PhoneIdentity", $phoneNs)
            $phone.SetAttribute("PhoneProductId", "7B1A2C3D-4E5F-4678-9ABC-DEF012345678")
            $phone.SetAttribute("PhonePublisherId", "00000000-0000-0000-0000-000000000000")
            [void]$root.AppendChild($phone)
            $manifestXml.Save($manifest)
          }

          # Add the manifest item only to the temporary extracted project.
          # The ZIP committed to the repository remains untouched.
          [xml]$xml = Get-Content $p.FullName
          $nsUri = $xml.DocumentElement.NamespaceURI
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("msb", $nsUri)
          $existing = $xml.SelectSingleNode("//msb:AppxManifest", $ns)

          if (-not $existing) {
            $group = $xml.CreateElement("ItemGroup", $nsUri)
            $item = $xml.CreateElement("AppxManifest", $nsUri)
            $item.SetAttribute("Include", "Package.appxmanifest")
            [void]$group.AppendChild($item)
            [void]$xml.DocumentElement.AppendChild($group)
            $xml.Save($p.FullName)
          }

          msbuild $p.FullName /restore /p:Configuration=Release /p:Platform=x64 /p:AppxPackage=true /p:AppxPackageSigningEnabled=false /p:AppxBundle=Never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign and validate MSIX without trust-store import
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"
          $project = Get-ChildItem "$env:RUNNER_TEMP\src" -Filter "*.csproj" -Recurse | Select-Object -First 1
          if (-not $project) { throw "Project file not found" }
          $package = Get-ChildItem (Join-Path $project.DirectoryName "AppPackages") -Filter "*_x64.msix" -Recurse | Select-Object -First 1
          if (-not $package) { throw "The x64 MSIX package was not generated" }
          [xml]$manifestXml = Get-Content -Raw (Join-Path $project.DirectoryName "Package.appxmanifest")
          $publisher = $manifestXml.Package.Identity.Publisher
          if ([string]::IsNullOrWhiteSpace($publisher)) { throw "Package Publisher is missing" }

          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Write-Host "Creating temporary test certificate..."
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName "AntiMicro Xbox Developer Mode Test" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(2)
          $pfxPath = Join-Path $env:RUNNER_TEMP "antimicro-signing.pfx"
          $pfxPassword = [guid]::NewGuid().ToString("N")
          $securePassword = ConvertTo-SecureString $pfxPassword -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $securePassword | Out-Null
          $certificatePath = Join-Path $artifactDir "AntiMicroXboxDev.cer"
          Export-Certificate -Cert $cert -FilePath $certificatePath | Out-Null

          $sdkBin = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\bin"
          $signtool = Get-ChildItem $sdkBin -Filter "signtool.exe" -Recurse -File |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK SignTool was not found" }

          Write-Host "Signing MSIX..."
          & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $pfxPassword $package.FullName
          if ($LASTEXITCODE -ne 0) { throw "SignTool sign failed: $LASTEXITCODE" }

          # Trust only this ephemeral CI test certificate, then perform a full signature verification.
          # This does not create a publicly trusted certificate; the console must separately trust the CER.
          Write-Host "Adding temporary test certificate to the runner trust stores..."
          & certutil.exe -addstore -f Root $certificatePath
          if ($LASTEXITCODE -ne 0) { throw "Could not add test certificate to Root store: $LASTEXITCODE" }
          & certutil.exe -addstore -f TrustedPeople $certificatePath
          if ($LASTEXITCODE -ne 0) { throw "Could not add test certificate to TrustedPeople store: $LASTEXITCODE" }

          Write-Host "Verifying MSIX signature and package integrity..."
          & $signtool.FullName verify /pa /v $package.FullName
          if ($LASTEXITCODE -ne 0) { throw "SignTool verification failed: $LASTEXITCODE" }

          $signature = Get-AuthenticodeSignature -FilePath $package.FullName
          if ($signature.Status -ne "Valid") {
            throw "MSIX signature status is not Valid: $($signature.Status) - $($signature.StatusMessage)"
          }
          if (-not $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) {
            throw "MSIX signer certificate mismatch"
          }
          Write-Host "MSIX signature verified successfully."

          Copy-Item $package.FullName (Join-Path $artifactDir $package.Name) -Force
          $dependencyDir = Join-Path $package.Directory.FullName "Dependencies\x64"
          if (Test-Path $dependencyDir) {
            New-Item -ItemType Directory -Force -Path (Join-Path $artifactDir "Dependencies\x64") | Out-Null
            Copy-Item (Join-Path $dependencyDir "*") (Join-Path $artifactDir "Dependencies\x64") -Recurse -Force
          }
          @"
          AntiMicro Xbox Developer Mode package
          1. Import AntiMicroXboxDev.cer into the Xbox Developer Mode trusted certificates.
          2. Install x64 dependencies if the console reports missing frameworks.
          3. Install the x64 MSIX through Xbox Device Portal.
          The package is test-signed; trust the included certificate on the console first.
          Successful packaging does not guarantee every feature works inside every Xbox game.
          "@ | Set-Content (Join-Path $artifactDir "INSTALL.txt") -Encoding UTF8
          if (-not (Get-ChildItem $artifactDir -File -Recurse | Where-Object { $_.Extension -eq ".msix" })) { throw "No MSIX found in staging directory" }
          if (-not (Test-Path $certificatePath)) { throw "Certificate missing from staging directory" }
          Write-Host "Staging completed."

      - uses: actions/upload-artifact@v4
        with:
          name: AntiMicro-MSIX-Xbox
          path: artifacts/**
          if-no-files-found: error
